# The first package source address, https://morcatt-labs.github.io/cattport/, stays working:
# every hour it copies the catalog of https://morcatt-labs.github.io/packages/, which lists every Morcatt Labs app.
name: Package source (old address)

on:
  schedule:
    - cron: "43 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package-source
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Copy the general catalog to gh-pages when it changed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir site && cd site
          curl --fail --silent --show-error --location -o index.json https://morcatt-labs.github.io/packages/index.json
          python3 -c "import json; json.load(open('index.json'))['packages']"
          cp index.json index.html
          touch .nojekyll
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init --quiet -b gh-pages
          if git fetch --quiet --depth 1 "$remote" gh-pages && git show FETCH_HEAD:index.json > /tmp/live.json 2>/dev/null \
             && cmp -s /tmp/live.json index.json; then
            echo "The old address is already up to date."
            exit 0
          fi
          git add -A
          git -c user.name="Morcatt Labs" -c user.email="119733840+morcatt@users.noreply.github.com" \
            commit --quiet -m "Package source: copy of morcatt-labs/packages"
          # One commit only: the branch holds the current catalog.
          git push --quiet --force "$remote" gh-pages
