<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Cattport</title>
<link rel="icon" href="images/cattport_32.png">
<link rel="stylesheet" href="page.css?v=__VERSION__">
</head>
<body>
<div class="shell" id="shell" hidden>
  <header class="bar">
    <nav class="tabs" aria-label="Main">
      <button class="nav" type="button" data-screen="apps" data-i18n="nav.apps"></button>
      <button class="nav" type="button" data-screen="settings" data-i18n="nav.settings"></button>
      <button class="nav" type="button" data-screen="diagnostics" data-i18n="nav.diagnostics"></button>
      <button class="nav" type="button" data-screen="help" data-i18n="nav.help"></button>
      <button class="nav" type="button" data-screen="about" data-i18n="nav.about"></button>
    </nav>
  </header>

  <main class="content">
    <section class="screen" id="screen-apps">
      <div class="head">
        <label class="search"><span class="sr" data-i18n="apps.search"></span><input id="search" type="search" data-i18n-placeholder="apps.search"></label>
        <button class="btn soft" id="add" type="button" data-i18n="apps.add"></button>
      </div>
      <div class="empty" id="empty" hidden>
        <h2 data-i18n="apps.emptyTitle"></h2>
        <p data-i18n="apps.emptyText"></p>
        <div class="row">
          <button class="btn primary big" type="button" data-open="docker" data-i18n="add.fromDocker"></button>
          <button class="btn soft big" type="button" data-open="link" data-i18n="add.link"></button>
        </div>
      </div>
      <p class="none" id="no-results" data-i18n="apps.noResults" hidden></p>
      <ul class="grid" id="apps"></ul>
    </section>

    <section class="screen narrow" id="screen-settings" hidden>
      <h1 data-i18n="nav.settings"></h1>
      <div class="panel">
        <div class="line"><span data-i18n="settings.theme"></span>
          <div class="segments" id="theme" role="group" data-i18n-label="settings.theme">
            <button type="button" data-value="auto" data-i18n="settings.auto"></button>
            <button type="button" data-value="light" data-i18n="settings.light"></button>
            <button type="button" data-value="dark" data-i18n="settings.dark"></button>
          </div>
        </div>
        <div class="line"><span data-i18n="settings.language"></span>
          <select class="select" id="language" data-i18n-label="settings.language"></select>
        </div>
        <div class="line"><span><span data-i18n="settings.online"></span><small data-i18n="settings.onlineHint"></small></span>
          <button class="switch" id="online" type="button" role="switch" data-i18n-label="settings.online"><span></span></button>
        </div>
      </div>
      <div class="panel">
        <div class="line"><span data-i18n="settings.backup"></span>
          <span class="row">
            <button class="btn soft" id="export" type="button" data-i18n="settings.export"></button>
            <button class="btn soft" id="import" type="button" data-i18n="settings.import"></button>
            <input id="import-file" type="file" accept="application/json,.json" hidden>
          </span>
        </div>
      </div>
    </section>

    <section class="screen narrow" id="screen-diagnostics" hidden>
      <h1 data-i18n="nav.diagnostics"></h1>
      <div class="panel" id="checks"></div>
      <div class="row"><button class="btn soft" id="recheck" type="button" data-i18n="diag.recheck"></button><button class="btn soft" id="copy-report" type="button" data-i18n="diag.copy"></button></div>
      <p class="hint" data-i18n="diag.privacy"></p>
    </section>

    <section class="screen narrow" id="screen-help" hidden>
      <h1 data-i18n="nav.help"></h1>
      <div class="panel prose">
        <h2 data-i18n="help.q1"></h2><p data-i18n="help.a1"></p>
        <h2 data-i18n="help.q2"></h2><p data-i18n="help.a2"></p>
        <h2 data-i18n="help.q3"></h2><p data-i18n="help.a3"></p>
        <h2 data-i18n="help.q4"></h2><p data-i18n="help.a4"></p>
        <h2 data-i18n="help.q5"></h2><p data-i18n="help.a5"></p>
      </div>
      <div class="contact">
        <p class="hint" data-i18n="help.bug"></p>
        <a class="btn soft report-link" target="_blank" rel="noopener noreferrer" data-i18n="about.report"></a>
      </div>
    </section>

    <section class="screen about" id="screen-about" hidden>
      <img src="images/cattport_256.png" alt="" width="112" height="112">
      <h1>Cattport</h1>
      <p id="version"></p>
      <p class="hint">© 2026 Morcatt Labs · GPLv3</p>
      <a class="btn soft report-link" target="_blank" rel="noopener noreferrer" data-i18n="about.report"></a>
    </section>
  </main>

  <div class="save-bar" id="save-bar" hidden><span class="unsaved"><i aria-hidden="true"></i><span id="unsaved" role="status"></span></span><button class="btn save" id="save-dsm" type="button" data-i18n="status.applyNow"></button></div>
  <div class="status" id="status" role="status" hidden><span id="status-text"></span><button id="status-action" type="button" hidden></button></div>
</div>

<div class="blocked" id="blocked" hidden><h1 id="blocked-title"></h1><p id="blocked-text"></p></div>

<dialog class="sheet" id="welcome">
  <h2 data-i18n="welcome.title"></h2>
  <p data-i18n="welcome.text"></p>
  <div class="panel" id="welcome-checks"></div>
  <div class="line boxed"><span><span data-i18n="settings.online"></span><small data-i18n="settings.onlineHint"></small></span>
    <button class="switch" id="welcome-online" type="button" role="switch" data-i18n-label="settings.online"><span></span></button>
  </div>
  <footer class="foot"><span class="grow"></span>
    <button class="btn soft big" type="button" data-welcome="link" data-i18n="add.link"></button>
    <button class="btn primary big" type="button" data-welcome="docker" data-i18n="add.fromDocker"></button>
  </footer>
</dialog>

<dialog class="sheet" id="add-sheet">
  <header class="sheet-head"><h2 class="grow" data-i18n="add.title"></h2><button class="close" type="button" data-close data-i18n-label="common.close">×</button></header>
  <div class="choices">
    <button class="choice" type="button" data-open="docker"><strong data-i18n="add.fromDocker"></strong><small data-i18n="add.dockerHint"></small></button>
    <button class="choice" type="button" data-open="link"><strong data-i18n="add.link"></strong><small data-i18n="add.linkHint"></small></button>
  </div>
</dialog>

<dialog class="sheet" id="docker-sheet">
  <header class="sheet-head"><h2 class="grow" data-i18n="add.fromDocker"></h2><button class="close" type="button" data-close data-i18n-label="common.close">×</button></header>
  <div id="docker-message" class="message" hidden></div>
  <div id="docker-body">
    <label class="search wide"><span class="sr" data-i18n="apps.search"></span><input id="docker-filter" type="search" data-i18n-placeholder="apps.search"></label>
    <label class="check"><input id="docker-all" type="checkbox"> <span data-i18n="docker.showAll"></span></label>
    <ul class="rows" id="docker-list"></ul>
    <footer class="foot"><span class="grow"></span><button class="btn primary big" id="docker-add" type="button"></button></footer>
  </div>
</dialog>

<dialog class="sheet" id="edit-sheet">
  <header class="sheet-head"><h2 class="grow" id="edit-title"></h2><button class="close" type="button" data-close data-i18n-label="common.close">×</button></header>
  <form id="edit-form" method="dialog" novalidate>
    <div class="edit-top">
      <div class="icon-col">
        <button class="preview" id="preview" type="button" data-i18n-label="edit.changeIcon"><img id="preview-img" alt="" hidden><span id="preview-mark"></span><i class="pencil" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"></path></svg></i></button>
        <div class="icons mini" id="suggestions" data-i18n-label="edit.icon" role="group"></div>
      </div>
      <div class="fields">
        <label class="field"><span class="required" data-i18n="edit.name"></span><input id="f-name" maxlength="48" autocomplete="off" required></label>
        <label class="field"><span class="required" data-i18n="edit.address"></span><input id="f-url" type="url" placeholder="http://" autocomplete="off" required></label>
        <div class="chips" id="ports"></div>
        <label class="field"><span data-i18n="edit.external"></span><input id="f-external" type="url" placeholder="https://" autocomplete="off"><small data-i18n="edit.externalHint"></small></label>
      </div>
    </div>
    <p class="warn" id="domain-warn" data-i18n="edit.domainNeeded" hidden></p>
    <p class="warn" id="edit-warn" hidden></p>

    <div class="panel options">
    <div class="line"><span data-i18n="edit.audience"></span>
      <div class="segments" id="audience" role="group" data-i18n-label="edit.audience">
        <button type="button" data-value="admins" data-i18n="edit.admins"></button>
        <button type="button" data-value="everyone" data-i18n="edit.everyone"></button>
      </div>
    </div>
    <label class="line toggle"><span data-i18n="edit.hide"></span><input id="f-hidden" type="checkbox" role="switch"></label>
    </div>
    <p class="error" id="edit-error" role="alert" hidden></p>
    <footer class="foot">
      <button class="btn danger big" id="delete-app" type="button" data-i18n="edit.delete" hidden></button>
      <a class="btn soft big" id="open-app" target="_blank" rel="noopener noreferrer" data-i18n="edit.open" hidden></a>
      <span class="grow"></span>
      <button class="btn soft big" type="button" data-close data-i18n="common.cancel"></button>
      <button class="btn primary big" id="save-app" type="submit" data-i18n="common.save"></button>
    </footer>
  </form>
</dialog>

<dialog class="sheet" id="icon-sheet">
  <header class="sheet-head"><h2 class="grow" data-i18n="edit.changeIcon"></h2><button class="close" type="button" data-close data-i18n-label="common.close">×</button></header>
  <div class="icons" id="icon-suggestions" data-i18n-label="edit.icon" role="group"></div>
  <p class="hint" id="suggest-status" role="status"></p>
  <div class="row wrap">
    <button class="btn soft grow" id="pick-pc" type="button" data-i18n="edit.fromComputer"></button>
    <button class="btn soft grow" id="pick-fs" type="button" data-i18n="edit.fromFiles"></button>
    <input id="pc-file" type="file" accept="image/*,.ico,.svg" hidden>
  </div>
  <span class="inline"><input id="icon-url" type="url" data-i18n-placeholder="edit.iconUrl" data-i18n-label="edit.iconUrl"><button class="btn soft" id="icon-url-go" type="button" data-i18n="edit.use"></button></span>
  <p class="error" id="icon-error" role="alert" hidden></p>
</dialog>

<dialog class="sheet" id="fs-sheet">
  <header class="sheet-head"><h2 class="grow" data-i18n="edit.fromFiles"></h2><button class="close" type="button" data-close data-i18n-label="common.close">×</button></header>
  <label class="search wide"><span class="sr" data-i18n="apps.search"></span><input id="fs-search" type="search" data-i18n-placeholder="apps.search"></label>
  <nav class="crumbs" id="fs-path" aria-label="Folder"></nav>
  <div class="gallery" id="fs-list"></div>
</dialog>
<script src="network.js?v=__VERSION__"></script>
<script src="text/en.js?v=__VERSION__"></script>
<script src="app.js?v=__VERSION__"></script>
</body>
</html>
